[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ideological-case-platform-backend"
version = "0.1.0"
description = "基于大语言模型的课程思政案例库信息化平台业务后端"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy[asyncio]==2.0.51",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
